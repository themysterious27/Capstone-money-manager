<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Money Manager</title>

    
    <link rel="stylesheet" href="css/style.css" />

    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>

  <body>
    <header>
      <h1>Money Manager App</h1>
    </header>

    <main>
      
      <section id="summary">
        <div class="card income">
          <h3>Income</h3>
          <p id="income">₹0</p>
        </div>

        <div class="card expense">
          <h3>Expense</h3>
          <p id="expense">₹0</p>
        </div>

        <div class="card balance">
          <h3>Balance</h3>
          <p id="balance">₹0</p>
        </div>
      </section>

      
      <div style="margin-bottom: 10px">
        <button id="openPopup">Add Transaction</button>
        <button id="downloadCSV">Download CSV</button>
      </div>

      
      <section id="filters">
        <select id="filterType">
          <option value="">All</option>
          <option value="income">Income</option>
          <option value="expense">Expense</option>
        </select>

        <select id="sort">
          <option value="">Sort</option>
          <option value="dateDesc">Newest</option>
          <option value="dateAsc">Oldest</option>
          <option value="amountHigh">High Amount</option>
          <option value="amountLow">Low Amount</option>
        </select>
      </section>

      
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Type</th>
            <th>SubCategory</th>
            <th>Description</th>
            <th>Amount</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="list"></tbody>
      </table>

      
      <div class="chart-container">
        <div class="chart-box">
          <h3>Expense Distribution</h3>
          <canvas id="chart"></canvas>
        </div>

        <div class="chart-box">
          <h3>Income Distribution</h3>
          <canvas id="incomeChart"></canvas>
        </div>
      </div>
    </main>

    
    <div id="popup" class="hidden">
      <form id="form">
        <h2>Transaction</h2>

        <input type="number" id="amount" placeholder="Amount" />
        <span class="error" id="amountError"></span>

        <input type="date" id="date" />
        <span class="error" id="dateError"></span>

        <div class="radio-group">
          <label>
            <input type="radio" name="type" value="Income" /> Income
          </label>
          <label>
            <input type="radio" name="type" value="Expense" /> Expense
          </label>
        </div>

        <span class="error" id="typeError"></span>

        <select id="subcategory"></select>
        <span class="error" id="subError"></span>

        <input type="text" id="desc" placeholder="Description" />

        <div style="display: flex; justify-content: space-between">
          <button type="submit">Save</button>
          <button type="button" id="closePopup">Cancel</button>
        </div>
      </form>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
